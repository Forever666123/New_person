[project]
name = "newperson"
version = "0.1.0"
description = "一个接入 Discord 的虚拟人物：像真人一样不秒回、会主动找你聊天、会发照片。"
requires-python = ">=3.11"
dependencies = [
    "discord.py>=2.4",
    "anthropic>=1.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "aiosqlite>=0.20",
    # Windows 没有系统自带的时区库，zoneinfo 找不到 America/New_York，她连启动都启动不了。
    # Linux 和 macOS 用系统的，不装这个包，服务器上的依赖不变。
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[project.scripts]
newperson = "newperson.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["newperson*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
